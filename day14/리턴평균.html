        // 선생님 ver.
        function subjcetAvg(arrData){
            let sum = 0;
            for(let i = 0; i < arrData.length; i++){
                sum += Number(prompt(`${arrData[i]}의 점수는?`));
            }
            let avg = Math.round(sum / arrData.length); // Math.round : 소수점 빼기
            return avg;
        }

        let arrsubject = ["국어","수학","영어"];
        let result = subjcetAvg(arrsubject);
        document.write(`평균 점수는 ${result}입니다.`);
