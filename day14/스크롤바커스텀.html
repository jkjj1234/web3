    <title>스크롤바커스텀</title>
    <style>
        * {
            padding: 0;
            margin: 0;
        }

        .section {
            height: 10000px;
            width: 10000px;
        }

        ::-webkit-scrollbar {
            width: 24px;
            height: 24px;
        }

        ::-webkit-scrollbar-track {
            background: tomato;
            border-radius: 16px;
        }

        ::-webkit-scrollbar-thumb {

            border-radius: 16px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #acacac;
        }
    </style>
