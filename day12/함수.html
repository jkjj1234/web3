<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>함수</title>
</head>
<body>
    <script>
        /*
        function 함수이름(){
            기능코드작성
        };
        */
        

        let count = 0;
        firstFunction(); // 함수 선언되기 전에 함수 호출 (o) 단, 함수에 쓰일 변수를 정의한 후에 가능!
        function firstFunction(){
            count++;
            document.write(`안녕하세요 ${count} <br>`);
        };
        firstFunction(); // 호출 -> 이름();
       


        let count2 = 100;
        // secondFunction(); // 함수 선언되기 전에 함수 호출 (x)--오류
        let secondFunction = function(){
            count2--;
            document.write(`안녕히계세요 ${count2} <br>`);
        };
        secondFunction();
       
    </script>
</body>
</html>
