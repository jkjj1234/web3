<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>고객정보</title>
</head>
<body>
    <script>
        // 모던자바스크립트(책)
        // mdn(자바스크립트 공식사이트)
        // 유저에게 이름을 입력받아 대문자로 변경하여 출력하기 ; toUpperCase() : 영문 소문자를 모두 대문자로 변환
        // 전화번호를 입력받을건데 입력받은 전화번호의 마지막 4자리를 ****로 처리할 것
        // 01012345678 -> 0101234****  ; substr(a, 문자 개수) : 문자열에 a인덱스부터 지정한 문자 개수만큼 문자열을 반환한다.
        // replace("바꿀문자","새문자") : 문자열에서 왼쪽부터 바꿀 문자와 일치하는 문자를 찾아 제일 먼저 찾은 문자를 새 문자로 치환한다.

        let userName = prompt("여권에 쓰여진 이름을 입력해주세요");
        let upperName = userName.toUpperCase();
        document.write(upperName, "<br>");

        let userNumber = prompt("전화번호를 입력해주세요","01012345678 형식으로 입력");
        let changeNum = userNumber.substring(0,userNumber.length-4) + "****";
        
        document.write(changeNum);
    </script>
</body>
</html>
